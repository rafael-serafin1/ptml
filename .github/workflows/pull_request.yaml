name: Continuos Request
on:
  pull_request:
    branches:
      - main

jobs:
  install:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/
            ptml_app.slnx
          sparse-checkout-cone-mode: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

  build_phase:
    runs-on: windows-latest
    needs: install

    steps:
      - name: Build
        run: dotnet build
      
      - name: Test
        run: dotnet test